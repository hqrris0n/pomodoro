# Runs the cafe timer as one small container. Put it on the same Docker
# network as your reverse proxy and point the proxy at cafe:8080
# (see deploy/Caddyfile.example).
services:
  cafe:
    build:
      context: .
      platforms: [linux/amd64]
    image: cafe-timer
    container_name: cafe
    restart: unless-stopped
    read_only: true
    mem_limit: 48m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # Without a shared proxy network, publish the port on the host instead:
    # ports: ['127.0.0.1:8090:8080']
    #
    # /data holds profiles.json and is the only writable path (the rest of
    # the filesystem is read-only). A named volume works out of the box. To
    # keep it in a folder on a NAS instead, use a host path; that folder must
    # be writable by uid 65534 (for example `chown 65534:65534 <folder>`):
    #   - /volume1/docker/cafe/data:/data
    #
    # To edit the drink menu or swap sounds without rebuilding the image,
    # also mount your own folders over the built-in ones:
    #   - ./web/public/drinks:/public/drinks:ro
    #   - ./web/public/sounds:/public/sounds:ro
    environment:
      # Caddy sits in front: take the client address from X-Forwarded-For for login rate limits.
      TRUST_PROXY: "1"
    volumes:
      - cafe-data:/data
    networks: [proxy]

volumes:
  cafe-data:

networks:
  # The network your reverse proxy container is attached to.
  proxy:
    external: true
